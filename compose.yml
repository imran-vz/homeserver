# ===========================================
# REUSABLE FRAGMENTS
# ===========================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-tailscale-sidecar: &tailscale-sidecar
  image: tailscale/tailscale:${TAILSCALE_VERSION:-latest}
  environment:
    - TS_AUTHKEY=${TS_AUTHKEY:-}
    - TS_STATE_DIR=/var/lib/tailscale
    - TS_EXTRA_ARGS=--advertise-tags=tag:container
    - TS_SERVE_CONFIG=/config/serve.json
    - TS_ENABLE_HEALTH_CHECK=true
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:9002/healthz"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s
  security_opt:
    - no-new-privileges:true
  cap_add:
    - NET_ADMIN
    - NET_RAW
  networks:
    - homelab_frontend
  logging: *default-logging
  restart: unless-stopped

# ===========================================
# SERVICES
# ===========================================

services:
  # ─── Tailscale Sidecars ────────────────────────────────────────

  immich-tailscale:
    <<: *tailscale-sidecar
    container_name: immich-tailscale
    hostname: immich
    volumes:
      - ./data/tailscale/immich:/var/lib/tailscale
      - ./config/tailscale-immich-serve.json:/config/serve.json:ro
    # Immich server needs backend network for Postgres/Redis access
    networks:
      - homelab_frontend
      - homelab_backend
    ports:
      - "127.0.0.1:2283:2283"

  beszel-tailscale:
    <<: *tailscale-sidecar
    container_name: beszel-tailscale
    hostname: beszel
    volumes:
      - ./data/tailscale/beszel:/var/lib/tailscale
      - ./config/tailscale-beszel-serve.json:/config/serve.json:ro
    ports:
      - "127.0.0.1:8090:8090"

  zerobyte-tailscale:
    <<: *tailscale-sidecar
    container_name: zerobyte-tailscale
    hostname: zerobyte
    volumes:
      - ./data/tailscale/zerobyte:/var/lib/tailscale
      - ./config/tailscale-zerobyte-serve.json:/config/serve.json:ro
    ports:
      - "127.0.0.1:4096:4096"

  audiobookshelf-tailscale:
    <<: *tailscale-sidecar
    container_name: audiobookshelf-tailscale
    hostname: audiobookshelf
    volumes:
      - ./data/tailscale/audiobookshelf:/var/lib/tailscale
      - ./config/tailscale-audiobookshelf-serve.json:/config/serve.json:ro

  jellyfin-tailscale:
    <<: *tailscale-sidecar
    container_name: jellyfin-tailscale
    hostname: jellyfin
    volumes:
      - ./data/tailscale/jellyfin:/var/lib/tailscale
      - ./config/tailscale-jellyfin-serve.json:/config/serve.json:ro
    # Jellyfin runs on the host — sidecar reaches it via host gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Application Services ──────────────────────────────────────

  zerobyte-server:
    container_name: zerobyte-server
    image: ghcr.io/nicotsx/zerobyte:${ZEROBYTE_VERSION:-latest}
    cap_add:
      # TODO: Required for FUSE mounts — consider scoping down if possible
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - APP_SECRET=${ZEROBYTE_APP_SECRET}
      - BASE_URL=${ZEROBYTE_BASE_URL}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/zerobyte:/var/lib/zerobyte
      # Mount external volumes for backup
      - /Volumes/Backup/Photos:/mnt/photos
      - type: bind
        source: /Volumes/Backup/homeserver-data/immich
        target: /mnt/immich
        bind:
          create_host_path: false
    network_mode: service:zerobyte-tailscale
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4096/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging
    depends_on:
      zerobyte-tailscale:
        condition: service_healthy
    restart: unless-stopped

  audiobookshelf-server:
    container_name: audiobookshelf-server
    image: ghcr.io/advplyr/audiobookshelf:${AUDIOBOOKSHELF_VERSION:-latest}
    security_opt:
      - no-new-privileges:true
    volumes:
      - /Volumes/Backup/Books:/audiobooks
      - ./data/audiobookshelf/config:/config
      - ./data/audiobookshelf/metadata:/metadata
    environment:
      - TZ=${TZ:-Asia/Kolkata}
    network_mode: service:audiobookshelf-tailscale
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.1"
          memory: 128M
    logging: *default-logging
    depends_on:
      audiobookshelf-tailscale:
        condition: service_healthy
    restart: unless-stopped

  beszel-server:
    container_name: beszel
    image: henrygd/beszel:${BESZEL_VERSION:-latest}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/beszel:/beszel_data
      - ./data/beszel-socket:/beszel_socket
    network_mode: service:beszel-tailscale
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      start_period: 5s
      interval: 120s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging
    depends_on:
      beszel-tailscale:
        condition: service_healthy
    restart: unless-stopped

  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:${BESZEL_AGENT_VERSION:-latest}
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/beszel-agent:/var/lib/beszel-agent
      - ./data/beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: ${BESZEL_HUB}
      # TOKEN and KEY will be generated in the Beszel web UI
      # Update these after adding the system in the web UI
      TOKEN: ${BESZEL_AGENT_TOKEN:-}
      KEY: ${BESZEL_AGENT_KEY:-}
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging: *default-logging
    depends_on:
      - beszel-server
    restart: unless-stopped

  # ─── Immich Stack ──────────────────────────────────────────────

  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # Note: Do NOT set user or read_only — Immich manages its own permissions
    security_opt:
      - no-new-privileges:true
    volumes:
      # Full Immich storage tree on external SSD; fail if the path is missing.
      - type: bind
        source: /Volumes/Backup/homeserver-data/immich
        target: /data
        bind:
          create_host_path: false
      # External library — read-write access to existing Photos folder
      - /Volumes/Backup/Photos:/mnt/media/photos
      # Timezone
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=${DB_USERNAME:-immich}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME:-immich}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOSTNAME=immich-redis
      - TZ=${TZ:-Asia/Kolkata}
    # Shares immich-tailscale's network (frontend + backend)
    network_mode: service:immich-tailscale
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
    # Uses image's built-in HEALTHCHECK
    healthcheck:
      disable: false
    logging: *default-logging
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
      immich-tailscale:
        condition: service_healthy
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # Note: ML container needs write access for model downloads
    security_opt:
      - no-new-privileges:true
    volumes:
      # ML cache on internal SSD (fast access for models)
      - ./data/immich-ml-cache:/cache
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - HF_HOME=/cache
      - MPLCONFIGDIR=/tmp/matplotlib
      # For Apple Silicon, use cpu provider
      - MACHINE_LEARNING_EXECUTION_PROVIDERS=cpu
    networks:
      - homelab_backend
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
    # Uses image's built-in HEALTHCHECK
    healthcheck:
      disable: false
    logging: *default-logging
    restart: unless-stopped

  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    security_opt:
      - no-new-privileges:true
    volumes:
      # Redis data on internal SSD (fast)
      - ./data/redis:/data
    networks:
      - homelab_backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  immich-postgres:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    # Note: PostgreSQL needs to run as root initially to set up permissions
    security_opt:
      - no-new-privileges:true
    volumes:
      # Database on internal SSD (fast I/O critical for DB)
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-immich}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # SSD storage — no need for HDD optimizations
    shm_size: 128mb
    networks:
      - homelab_backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-immich} -d ${DB_DATABASE_NAME:-immich}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

# ===========================================
# NETWORKS
# ===========================================

networks:
  homelab_frontend:
    external: true
  homelab_backend:
    external: true
